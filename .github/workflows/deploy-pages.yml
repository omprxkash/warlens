name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Frontend talks to the backend over CORS. Point this at your Space URL.
      # Change once your Space is live, e.g. https://omprxkash-warlens-api.hf.space
      REACT_APP_API_URL: ${{ vars.WARLENS_API_URL || 'https://omprxkash-warlens-api.hf.space' }}
      # Tells CRA to emit asset URLs under /warlens/ (the repo subpath).
      PUBLIC_URL: /warlens
      CI: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npx react-scripts build

      - name: SPA fallback for project pages
        run: cp build/index.html build/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
